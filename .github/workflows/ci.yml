name: CI

# Every build compiles with `release 17`, the baseline, so the bytecode does not depend on the JDK. It is built and tested
# on JDK 17, the oldest runtime, and on JDK 27, the runtime the server is headed for. Every run: build, tests and Javadoc
# of every module. Pushes to master and release tags, and pull requests from this repository, add coverage and the
# SonarCloud analysis on JDK 17 (not gating; pull requests from forks get no token). Nothing in this repository
# publishes to Maven Central (see .claude/CLAUDE.md). After a green build, a push to master, or a run by hand on a
# branch, publishes SNAPSHOTs to maven.descoped.io (job snapshot), never a release.
on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  # To run it on any branch by hand.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request ends the run it replaces. On a branch, runs queue instead: a cancelled
# snapshot job could leave the modules' SNAPSHOTs at different builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '27']
    env:
      # Coverage and SonarCloud: once, on the baseline JDK, for pushes and pull requests from this repository (a
      # fork's gets no secrets).
      ANALYSE: ${{ matrix.java == '17' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # SonarCloud needs the history to attribute new code.
          fetch-depth: ${{ env.ANALYSE == 'true' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build, test and Javadoc
        if: env.ANALYSE != 'true'
        run: ./mvnw --batch-mode --no-transfer-progress verify javadoc:javadoc

      - name: Build, test, Javadoc and coverage
        if: env.ANALYSE == 'true'
        run: ./mvnw --batch-mode --no-transfer-progress verify javadoc:javadoc -P coverage

      # Analysis only: a SonarCloud outage or token problem must not fail the build, so this step does not gate.
      # On a pull request the scanner reads the pull request number, branch and base from GitHub Actions itself.
      - name: SonarCloud
        if: env.ANALYSE == 'true'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        run: ./mvnw --batch-mode --no-transfer-progress -P sonar org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

  # SNAPSHOTs to Descoped's AWS CodeArtifact repository, read publicly at https://maven.descoped.io/, for development
  # across repositories: on a push to master (X.Y.Z-SNAPSHOT) and on a run by hand, on master as a push does and on
  # any other branch as X.Y.Z-<branch>-SNAPSHOT, so it never replaces master's. Never on a pull request or a tag. The
  # role is taken through GitHub's OIDC token; its ARN is an organization secret. The POM has no distributionManagement
  # and the deploy names only a SNAPSHOT target, so a release version has no repository; the guard below refuses one
  # before anything is uploaded. The samples are not published.
  snapshot:
    name: Publish SNAPSHOTs
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
      || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two runs on one branch never interleave their uploads of maven-metadata.xml.
    concurrency:
      group: snapshot-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Branch version
        if: github.ref != 'refs/heads/master'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          name=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9.' '-')
          ./mvnw --batch-mode --no-transfer-progress versions:set -DgenerateBackupPoms=false \
            -DnewVersion="${version%-SNAPSHOT}-${name}-SNAPSHOT"

      - name: Only a SNAPSHOT
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          case "$version" in
            *-SNAPSHOT) echo "Publishing $version" ;;
            *) echo "Not a SNAPSHOT: $version"; exit 1 ;;
          esac

      # Last before the deploy, so no other step runs while the role's credentials exist. They are not exported to
      # the job's environment: only the deploy step gets them, for at most 15 minutes.
      - id: aws
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.CODEARTIFACT_SNAPSHOTS_ROLE_ARN }}
          aws-region: eu-north-1
          role-duration-seconds: 900
          mask-aws-account-id: true
          output-credentials: true
          output-env-credentials: false

      # The CodeArtifact token lives 15 minutes and only in this step's shell; settings.xml reads it from there. The
      # account is the role's own and the publishing endpoint is looked up here, so neither is in a public file. The
      # account is masked first, so the log hides it in any line that contains it; the endpoint and its origin too. The server
      # descoped-snapshots lists the endpoint's origin in repositoryOrigins, and credentialScope=strict refuses
      # credentials for any repository they are not bound to, so the token goes there and nowhere else; the POM reads
      # maven.descoped.io under another id.
      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          AWS_REGION: eu-north-1
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$account"
          token=$(aws codeartifact get-authorization-token --domain descoped \
            --duration-seconds 900 --query authorizationToken --output text)
          echo "::add-mask::$token"
          export CODEARTIFACT_AUTH_TOKEN="$token"
          url=$(aws codeartifact get-repository-endpoint --domain descoped --repository maven-snapshots \
            --format maven --query repositoryEndpoint --output text)
          origin="${url%%/maven/*}"
          echo "::add-mask::$url"
          echo "::add-mask::$origin"
          export SNAPSHOTS_ORIGIN="$origin"
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings>
            <servers>
              <server>
                <id>descoped-snapshots</id>
                <username>aws</username>
                <password>${env.CODEARTIFACT_AUTH_TOKEN}</password>
                <repositoryOrigins>
                  <repositoryOrigin>${env.SNAPSHOTS_ORIGIN}</repositoryOrigin>
                </repositoryOrigins>
              </server>
            </servers>
          </settings>
          XML
          # The target is named here and applies to SNAPSHOTs only: a release version has no repository and fails.
          ./mvnw --batch-mode --no-transfer-progress -Dmaven.repository.credentialScope=strict \
            -DaltSnapshotDeploymentRepository="descoped-snapshots::$url" -DdeployAtEnd=true \
            -DskipTests -DskipITs source:jar-no-fork deploy

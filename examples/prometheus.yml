global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
- job_name: prometheus
  static_configs:
  - targets: ['localhost:9090']

- job_name: data-collector
  authorization:
    credentials_file: /etc/prometheus/dc-token
  static_configs:
  - targets: ['data-collector-postgres:9990']

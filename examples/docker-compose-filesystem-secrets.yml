services:

  data-collector-filesystem:
    image: $DC_IMAGE
    ports:
      - 9990:9990
      - 9992:9992
    environment:
      - DC_http.authentication.bearer.token=${DC_TOKEN:?set DC_TOKEN to the bearer token the server requires; make sets it from .dc-token}
      - JAVA_TOOL_OPTIONS=-Dlog4j2.configurationFile=/conf/log4j2.xml
    volumes:
    - $WORKDIR/profile/$PROFILE/conf:/conf
    - $WORKDIR/profile/$PROFILE/certs:/certs
    - $WORKDIR/target:/target
